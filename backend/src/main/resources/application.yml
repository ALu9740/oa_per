# Spring Boot 核心配置
spring:
  profiles:
    # 激活的环境（dev-开发，prod-生产）
    active: dev
  application:
    # 应用名称
    name: oa_server
  ai:
    openai:
      # 阿里云 DashScope 兼容 OpenAI 的接口地址
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      # 阿里云 DashScope 兼容 OpenAI 的 API 密钥
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          # 阿里云 DashScope 兼容 OpenAI 的模型
          model: ${AI_DASHSCOPE_MODEL:qwen3.7-flash}
          # 温度参数，控制生成文本的随机性
          temperature: ${AI_TEMPERATURE:0.3}
      embedding:
        options:
          # 阿里云 DashScope 兼容 OpenAI 的嵌入模型
          model: ${AI_DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
          # 嵌入模型的维度
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1024}
      # 向量数据库配置
      vectorstore:
        qdrant:
          # qdrant 主机地址
          host: ${QDRANT_HOST:localhost}
          # qdrant 端口号
          port: ${QDRANT_PORT:6334}
          # 向量数据库集合名称
          collection-name: ${QDRANT_COLLECTION_NAME:oa_kb}
          # 是否初始化向量数据库模式
          initialize-schema: ${QDRANT_INIT_SCHEMA:false}

# SSE 流式接口的异步超时时间（5 分钟）
mvc:
  async:
    response-timeout: 300000

# MyBatis-Plus 配置
mybatis-plus:
  # Mapper XML 文件路径
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启下划线转驼峰映射
    map-underscore-to-camel-case: true
    # 控制台输出 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: isDeleted
      # 删除时字段值
      logic-delete-value: 1
      # 未删除时字段值
      logic-not-delete-value: 0

# 服务器配置
server:
  # 应用端口号
  port: 8097

# MinIO 对象存储配置
oa_server:
  minio:
    # MinIO 服务地址
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 访问密钥
    access-key: ${MINIO_ACCESS_KEY:}
    # 私有密钥
    secret-key: ${MINIO_SECRET_KEY:}
    # 存储桶名称
    bucket: ${MINIO_BUCKET:}
    # 访问 URL 前缀
    url-prefix: ${MINIO_URL_PREFIX:/minio}

# JWT 签名密钥
jwt:
  # 签名密钥
  secret: ${JWT_SECRET:oa_server-dev-secret-key-change-in-production-must-be-256-bits}
  # 访问令牌过期时间（毫秒）
  access-token-expiration: 7200000      # 2小时
  # 刷新令牌过期时间（毫秒）
  refresh-token-expiration: 604800000   # 7天
